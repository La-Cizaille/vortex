# Build, test and quality gates. Every third-party action is pinned to a full commit SHA
# (tags are mutable); Dependabot proposes updates. See docs/SECURITY.md §6.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Minimum line coverage of Vortex.Core (docs/CONTRIBUTING.md).
  CORE_MIN_LINE_COVERAGE: "0.90"

jobs:
  dotnet:
    name: Build & test (.NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore dotnet/Vortex.sln --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build dotnet/Vortex.sln -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test dotnet/Vortex.sln -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage gate (Vortex.Core)
        run: |
          report=$(find TestResults -name coverage.cobertura.xml | head -1)
          python3 - "$report" <<'EOF'
          import os, sys, xml.etree.ElementTree as ET
          minimum = float(os.environ["CORE_MIN_LINE_COVERAGE"])
          pkg = next(p for p in ET.parse(sys.argv[1]).getroot().iter("package") if p.get("name") == "Vortex.Core")
          rate = float(pkg.get("line-rate"))
          print(f"Vortex.Core line coverage: {rate:.1%} (minimum {minimum:.0%})")
          sys.exit(0 if rate >= minimum else 1)
          EOF

      - name: Format check
        run: dotnet format dotnet/Vortex.sln --verify-no-changes --no-restore

      - name: Vulnerable dependencies (direct and transitive)
        run: |
          dotnet list dotnet/Vortex.sln package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Content is valid and canonical, catalogue is up to date
        run: |
          tool="dotnet run -c Release --no-build --project dotnet/Vortex.ContentTool --"
          $tool validate core/Runtime/Data
          $tool format core/Runtime/Data --check
          $tool docs core/Runtime/Data docs --check

      - name: Simulator smoke run (no engine error)
        run: dotnet run -c Release --no-build --project dotnet/Vortex.Simulator -- run --players 2,5 --games 10 --out simulation-smoke.md

      - name: Variant comparison smoke run (every committed variant loads and plays)
        shell: bash
        run: |
          set -euo pipefail
          for f in docs/balance/variants/*.json; do
            dotnet run -c Release --no-build --project dotnet/Vortex.Simulator -- compare --players 3 --games 5 --variant "$f" --out compare-smoke.md
          done

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The CLI is used directly: gitleaks-action requires a paid licence for organisation accounts.
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks

      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
